# =============================
# PanelRental — Docker Compose (Cloudflare SSL)
# Cloudflare handles HTTPS → Nginx HTTP only → App :3000
# =============================

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-panelrental}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${DB_NAME:-panelrental}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-panelrental} -d ${DB_NAME:-panelrental}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js App
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:***@db:5432/${DB_NAME:-panelrental}
      AUTH_SECRET: ${AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://panel-rental.com}
      SERVER_PUBLIC_IP: ${SERVER_PUBLIC_IP}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx (HTTP only — Cloudflare terminates SSL)
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-cloudflare.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  pgdata:
  uploads:

networks:
  default:
    name: ${NETWORK_NAME:-panelrental}
